[package]
name = "ambition-store"
version.workspace = true
edition.workspace = true

[dependencies]
ambition-core = { path = "../core" }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
