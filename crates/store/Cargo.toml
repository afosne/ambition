[package]
name = "ambition-store"
version.workspace = true
edition.workspace = true

[dependencies]
ambition-core = { path = "../core" }
ambition-srs = { path = "../srs" }
ambition-writing = { path = "../writing" }
serde = "1"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
