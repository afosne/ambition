[package]
name = "ambition-gen"
version.workspace = true
edition.workspace = true

[dependencies]
ambition-core = { path = "../core" }
ambition-jev = { path = "../jev" }
ambition-llm = { path = "../llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
wiremock = "0.6"
