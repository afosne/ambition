[package]
name = "ambition-tui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ambition"
path = "src/main.rs"

[dependencies]
ambition-core = { path = "../core" }
ambition-engine = { path = "../engine" }
ambition-gamify = { path = "../gamify" }
ambition-translate = { path = "../translate" }
ambition-writing = { path = "../writing" }
crossterm = "0.28"
ratatui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
unicode-width = "0.2"
