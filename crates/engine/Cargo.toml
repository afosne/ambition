[package]
name = "ambition-engine"
version.workspace = true
edition.workspace = true

[dependencies]
ambition-core = { path = "../core" }
ambition-gamify = { path = "../gamify" }
ambition-gen = { path = "../gen" }
ambition-grader = { path = "../grader" }
ambition-jev = { path = "../jev" }
ambition-llm = { path = "../llm" }
ambition-store = { path = "../store" }
ambition-srs = { path = "../srs" }
ambition-translate = { path = "../translate" }
ambition-writing = { path = "../writing" }
ambition-vocab = { path = "../vocab" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
wiremock = "0.6"
