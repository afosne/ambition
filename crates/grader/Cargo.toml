[package]
name = "ambition-grader"
version.workspace = true
edition.workspace = true

[dependencies]
ambition-core = { path = "../core" }
ambition-jev = { path = "../jev" }
ambition-llm = { path = "../llm" }
ambition-writing = { path = "../writing" }
serde = "1"
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
wiremock = "0.6"
